<!DOCTYPE html>
<html>

<head>
    <title>Yuchan's Learning App</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 30px;
            padding: 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .correct {
            background-color: lightgreen;
        }

        .wrong {
            background-color: lightcoral;
        }

        #feedback {
            margin-top: 30px;
            font-size: 28px;
        }
    </style>
</head>

<body>

    <h1>Vocabulary Quiz</h1>

    <p>What does "in charge of" mean?</p>

    <button class="wrong" onclick="checkAnswer('wrong')">
        Participate in
    </button>

    <button class="correct" onclick="checkAnswer('correct')">
        Be responsible for something
    </button>

    <button class="wrong" onclick="checkAnswer('wrong')">
        Watch
    </button>

    <h3 id="feedback"></h3>

    <script>
        function checkAnswer(answer) {

            if (answer === "correct") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is 'Be responsible for something.'";
            }

        }
    </script>

</body>

</html>
