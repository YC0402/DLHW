<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Yuchan's Infinite Bounce Ball</title>

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(#7fd3ff, #fefefe);
            overflow: hidden;
        }

        h1 {
            margin: 10px 0 5px;
        }

        #info {
            font-size: 19px;
            margin-bottom: 8px;
        }

        canvas {
            background: linear-gradient(#dff6ff, #ffffff);
            border: 4px solid #222;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>🏀 Infinite Bounce Ball</h1>

    <div id="info">
        ⬅️ ➡️ Move |
        Score: <span id="score">0</span> |
        Level: <span id="level">1</span>
    </div>

    <canvas id="gameCanvas" width="600" height="650"></canvas>

    <script>

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const ball = {
            x: 300,
            y: 500,
            radius: 17,
            speedX: 0,
            speedY: -11
        };

        let gravity = 0.48;
        let moveSpeed = 5.5;

        let score = 0;
        let level = 1;
        let gameOver = false;

        let leftPressed = false;
        let rightPressed = false;

        let platforms = [];


        // =========================
        // 키보드 입력
        // =========================

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowLeft") {
                leftPressed = true;
            }

            if (event.key === "ArrowRight") {
                rightPressed = true;
            }

        });


        document.addEventListener("keyup", function(event) {

            if (event.key === "ArrowLeft") {
                leftPressed = false;
            }

            if (event.key === "ArrowRight") {
                rightPressed = false;
            }

        });


        // =========================
        // 랜덤 숫자
        // =========================

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }


        // =========================
        // 발판 생성
        // =========================

        function createPlatforms() {

            platforms = [];

            // 첫 시작 발판
            platforms.push({
                x: 220,
                y: 580,
                width: 160,
                height: 18,
                moving: false,
                speed: 0
            });


            let y = 500;

            for (let i = 0; i < 8; i++) {

                const width = random(80, 150);

                const x = random(
                    20,
                    canvas.width - width - 20
                );

                const isMoving =
                    Math.random() < 0.30;

                platforms.push({

                    x: x,
                    y: y,
                    width: width,
                    height: 18,

                    moving: isMoving,

                    speed:
                        isMoving
                        ? random(1, 2.5)
                        : 0

                });

                y -= random(65, 95);

            }

        }


        // =========================
        // 발판 움직임
        // =========================

        function movePlatforms() {

            platforms.forEach(function(platform) {

                if (platform.moving) {

                    platform.x += platform.speed;

                    if (
                        platform.x <= 0 ||
                        platform.x + platform.width >= canvas.width
                    ) {

                        platform.speed *= -1;

                    }

                }

            });

        }


        // =========================
        // 발판 그리기
        // =========================

        function drawPlatforms() {

            platforms.forEach(function(platform) {

                if (platform.moving) {
                    ctx.fillStyle = "#ffb347";
                } else {
                    ctx.fillStyle = "#66cc66";
                }

                ctx.fillRect(
                    platform.x,
                    platform.y,
                    platform.width,
                    platform.height
                );

                ctx.strokeStyle = "#333";
                ctx.lineWidth = 2;

                ctx.strokeRect(
                    platform.x,
                    platform.y,
                    platform.width,
                    platform.height
                );

            });

        }


        // =========================
        // 공 그리기
        // =========================

        function drawBall() {

            ctx.beginPath();

            ctx.arc(
                ball.x,
                ball.y,
                ball.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#ff4d6d";

            ctx.fill();

            ctx.strokeStyle = "#222";
            ctx.lineWidth = 3;

            ctx.stroke();

            ctx.closePath();

        }


        // =========================
        // 발판 충돌
        // =========================

        function checkPlatformCollision() {

            platforms.forEach(function(platform) {

                const ballBottom =
                    ball.y + ball.radius;

                const previousBottom =
                    ball.y + ball.radius - ball.speedY;

                const insideX =
                    ball.x + ball.radius > platform.x &&
                    ball.x - ball.radius < platform.x + platform.width;


                if (
                    insideX &&
                    ball.speedY > 0 &&
                    ballBottom >= platform.y &&
                    previousBottom <= platform.y + 12
                ) {

                    ball.y =
                        platform.y - ball.radius;

                    ball.speedY =
                        -11.5;

                    score++;

                    document.getElementById("score").innerText =
                        score;

                }

            });

        }


        // =========================
        // 다음 맵 생성
        // =========================

        function nextLevel() {

            level++;

            document.getElementById("level").innerText =
                level;


            // 레벨 올라갈수록 조금 더 어려움
            gravity += 0.01;

            moveSpeed += 0.08;


            createPlatforms();


            ball.x =
                canvas.width / 2;

            ball.y =
                560;

            ball.speedY =
                -11;

            ball.speedX =
                0;

        }


        // =========================
        // 공 이동
        // =========================

        function moveBall() {

            if (leftPressed) {

                ball.speedX -= 0.6;

            }

            if (rightPressed) {

                ball.speedX += 0.6;

            }

            if (!leftPressed && !rightPressed) {

                ball.speedX *= 0.90;

            }


            // 최대 좌우 속도 제한
            if (ball.speedX > moveSpeed) {
                ball.speedX = moveSpeed;
            }

            if (ball.speedX < -moveSpeed) {
                ball.speedX = -moveSpeed;
            }


            ball.x += ball.speedX;


            // 중력
            ball.speedY += gravity;

            ball.y += ball.speedY;


            // 양 옆 벽에서 튕김
            if (ball.x - ball.radius <= 0) {

                ball.x = ball.radius;

                ball.speedX *= -0.7;

            }


            if (
                ball.x + ball.radius >= canvas.width
            ) {

                ball.x =
                    canvas.width - ball.radius;

                ball.speedX *= -0.7;

            }


            checkPlatformCollision();


            // 위까지 도달하면 다음 맵
            if (ball.y < 20) {

                nextLevel();

            }


            // 아래로 떨어지면 게임 오버
            if (
                ball.y >
                canvas.height + 50
            ) {

                gameOver = true;

            }

        }


        // =========================
        // 게임 오버 화면
        // =========================

        function drawGameOver() {

            ctx.fillStyle =
                "rgba(0,0,0,0.65)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "white";

            ctx.font =
                "50px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "💥 GAME OVER",
                canvas.width / 2,
                260
            );


            ctx.font =
                "28px Arial";

            ctx.fillText(
                "Score: " + score,
                canvas.width / 2,
                320
            );


            ctx.fillText(
                "Level: " + level,
                canvas.width / 2,
                365
            );


            ctx.font =
                "22px Arial";

            ctx.fillText(
                "Press SPACE to restart",
                canvas.width / 2,
                430
            );

        }


        // =========================
        // 재시작
        // =========================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.code === "Space" &&
                    gameOver
                ) {

                    restartGame();

                }

            }
        );


        function restartGame() {

            score = 0;
            level = 1;

            gravity = 0.48;
            moveSpeed = 5.5;

            document.getElementById("score").innerText =
                score;

            document.getElementById("level").innerText =
                level;


            ball.x =
                300;

            ball.y =
                500;

            ball.speedX =
                0;

            ball.speedY =
                -11;


            createPlatforms();

            gameOver =
                false;

        }


        // =========================
        // 게임 루프
        // =========================

        function gameLoop() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            movePlatforms();

            drawPlatforms();

            drawBall();


            if (!gameOver) {

                moveBall();

            }

            else {

                drawGameOver();

            }


            requestAnimationFrame(
                gameLoop
            );

        }


        // 시작
        createPlatforms();

        gameLoop();

    </script>

</body>

</html>
