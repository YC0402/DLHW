<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Yuchan's Bounce Ball Game</title>

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(#87CEEB, #ffffff);
            overflow: hidden;
        }

        h1 {
            margin: 10px;
        }

        #info {
            font-size: 20px;
            margin-bottom: 5px;
        }

        canvas {
            background: #dff6ff;
            border: 4px solid #333;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<h1>🏀 Yuchan's Bounce Ball</h1>

<div id="info">
    ⬅️ ➡️ 방향키로 움직이세요!
    <br>
    Score: <span id="score">0</span>
</div>

<canvas id="gameCanvas" width="600" height="600"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");


// ================================
// 공 설정
// ================================

const ball = {
    x: 100,
    y: 450,
    radius: 18,

    speedX: 0,

    speedY: -10
};


// 중력
const gravity = 0.45;


// 좌우 움직임 속도
const moveSpeed = 5;


// 점수
let score = 0;


// 게임 종료 여부
let gameOver = false;


// ================================
// 발판
// ================================

const platforms = [

    {
        x: 50,
        y: 520,
        width: 150,
        height: 20
    },

    {
        x: 260,
        y: 440,
        width: 130,
        height: 20
    },

    {
        x: 80,
        y: 350,
        width: 120,
        height: 20
    },

    {
        x: 350,
        y: 270,
        width: 140,
        height: 20
    },

    {
        x: 180,
        y: 180,
        width: 130,
        height: 20
    },

    {
        x: 420,
        y: 90,
        width: 120,
        height: 20
    }

];


// ================================
// 키 입력
// ================================

let leftPressed = false;
let rightPressed = false;


document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        leftPressed = true;
    }

    if (event.key === "ArrowRight") {
        rightPressed = true;
    }

});


document.addEventListener("keyup", function(event) {

    if (event.key === "ArrowLeft") {
        leftPressed = false;
    }

    if (event.key === "ArrowRight") {
        rightPressed = false;
    }

});


// ================================
// 공 그리기
// ================================

function drawBall() {

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ff4d6d";

    ctx.fill();

    ctx.strokeStyle = "#333";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.closePath();

}


// ================================
// 발판 그리기
// ================================

function drawPlatforms() {

    platforms.forEach(function(platform) {

        ctx.fillStyle = "#66cc66";

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

        ctx.strokeStyle = "#333";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

    });

}


// ================================
// 충돌 검사
// ================================

function checkPlatformCollision() {

    platforms.forEach(function(platform) {

        const ballBottom =
            ball.y + ball.radius;

        const previousBottom =
            ball.y + ball.radius - ball.speedY;


        const insideX =
            ball.x + ball.radius > platform.x &&
            ball.x - ball.radius < platform.x + platform.width;


        if (
            insideX &&
            ball.speedY > 0 &&
            ballBottom >= platform.y &&
            previousBottom <= platform.y + 10
        ) {

            // 발판 위에 착지
            ball.y =
                platform.y - ball.radius;


            // 자동으로 다시 튀기
            ball.speedY = -11;


            // 점수 증가
            score++;

            document.getElementById("score").innerText =
                score;

        }

    });

}


// ================================
// 공 움직이기
// ================================

function moveBall() {

    if (leftPressed) {

        ball.speedX = -moveSpeed;

    }

    else if (rightPressed) {

        ball.speedX = moveSpeed;

    }

    else {

        ball.speedX *= 0.85;

    }


    ball.x += ball.speedX;


    // 중력
    ball.speedY += gravity;

    ball.y += ball.speedY;


    // 왼쪽 벽
    if (
        ball.x - ball.radius < 0
    ) {

        ball.x = ball.radius;

        ball.speedX = 0;

    }


    // 오른쪽 벽
    if (
        ball.x + ball.radius > canvas.width
    ) {

        ball.x =
            canvas.width - ball.radius;

        ball.speedX = 0;

    }


    // 발판 충돌
    checkPlatformCollision();


    // 화면 위까지 도착하면 승리
    if (
        ball.y < 30
    ) {

        gameOver = true;

        setTimeout(function() {

            alert(
                "🎉 게임 클리어!\n점수: " + score
            );

            restartGame();

        }, 100);

    }


    // 아래로 떨어지면 게임 오버
    if (
        ball.y > canvas.height + 50
    ) {

        gameOver = true;

        setTimeout(function() {

            alert(
                "💥 Game Over!\n점수: " + score
            );

            restartGame();

        }, 100);

    }

}


// ================================
// 게임 다시 시작
// ================================

function restartGame() {

    ball.x = 100;

    ball.y = 450;

    ball.speedX = 0;

    ball.speedY = -10;

    score = 0;

    document.getElementById("score").innerText =
        score;

    gameOver = false;

}


// ================================
// 게임 반복
// ================================

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawPlatforms();

    drawBall();


    if (!gameOver) {

        moveBall();

    }


    requestAnimationFrame(gameLoop);

}


// 게임 시작
gameLoop();

</script>

</body>
</html>
