<!DOCTYPE html>
<html>

<head>
    <title>Yuchan's English Education Quiz</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 40px;
        }

        #question {
            font-size: 28px;
            margin: 30px;
        }

        button {
            display: block;
            width: 600px;
            font-size: 20px;
            padding: 18px;
            margin: 12px auto;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: lightyellow;
        }

        button:hover {
            background-color: gold;
        }

        #feedback {
            margin-top: 30px;
            font-size: 26px;
        }

        #score {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>English Education Quiz</h1>

    <p id="question"></p>

    <div id="answers"></div>

    <h3 id="feedback"></h3>

    <p id="score"></p>

    <script>

        const wordBank = [

            {
                word: "Grammar Translation Method",
                correct: "A method focusing on grammar rules, translation, and reading written texts"
            },

            {
                word: "Direct Method",
                correct: "A method that teaches the target language without using the learners' first language"
            },

            {
                word: "Audiolingual Method",
                correct: "A method emphasizing repetition, drills, habit formation, and spoken language"
            },

            {
                word: "Communicative Language Teaching",
                correct: "An approach that emphasizes meaningful communication and real-life language use"
            },

            {
                word: "Communicative Competence",
                correct: "The ability to use language appropriately and effectively in social contexts"
            },

            {
                word: "Linguistic Competence",
                correct: "Knowledge of grammar, vocabulary, pronunciation, and language structure"
            },

            {
                word: "Contrastive Analysis",
                correct: "The comparison of two languages to predict possible learner difficulties"
            },

            {
                word: "Error Analysis",
                correct: "The study of learner errors to understand the process of second language acquisition"
            },

            {
                word: "Interlanguage",
                correct: "A developing language system created by second language learners"
            },

            {
                word: "Intralingual Error",
                correct: "An error caused by difficulty within the target language itself"
            },

            {
                word: "Interlingual Error",
                correct: "An error caused by influence from the learner's first language"
            },

            {
                word: "Constructivism",
                correct: "A theory that learners actively construct knowledge through experience and interaction"
            },

            {
                word: "Structural Linguistics",
                correct: "An approach viewing language as a system of structures and patterns"
            },

            {
                word: "Generative Linguistics",
                correct: "A theory emphasizing the mental rules that allow speakers to produce unlimited sentences"
            },

            {
                word: "Behaviorism",
                correct: "A theory that explains learning through stimulus, response, reinforcement, and habit formation"
            },

            {
                word: "Cognitive Psychology",
                correct: "An approach focusing on mental processes such as memory, perception, and problem solving"
            },

            {
                word: "Compensation Strategy",
                correct: "A strategy used to overcome gaps in language knowledge during communication"
            },

            {
                word: "Circumlocution",
                correct: "Explaining an unknown word by describing its meaning in other words"
            },

            {
                word: "Paraphrase",
                correct: "Expressing the same meaning using different words"
            },

            {
                word: "Series Method",
                correct: "A method that teaches language through a sequence of connected actions"
            }

        ];


        // Randomly mix all questions
        const shuffledWords = [...wordBank].sort(() => Math.random() - 0.5);

        // Select only 5 questions
        const quiz = shuffledWords.slice(0, 5);

        let currentQuestion = 0;
        let score = 0;


        function showQuestion() {

            const question = quiz[currentQuestion];

            document.getElementById("question").innerText =
                "Question " + (currentQuestion + 1) +
                " / 5: What is \"" + question.word + "\"?";

            document.getElementById("feedback").innerText = "";

            const answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            // Correct answer
            let choices = [question.correct];

            // Select 4 wrong answers
            const wrongAnswers = wordBank
                .filter(item => item.word !== question.word)
                .map(item => item.correct)
                .sort(() => Math.random() - 0.5)
                .slice(0, 4);

            choices = choices.concat(wrongAnswers);

            // Shuffle answer choices
            choices.sort(() => Math.random() - 0.5);


            choices.forEach(function(choice) {

                const button = document.createElement("button");

                button.innerText = choice;

                button.onclick = function() {
                    checkAnswer(choice, button);
                };

                answersDiv.appendChild(button);

            });


            document.getElementById("score").innerText =
                "Score: " + score + " / 5";

        }


        function checkAnswer(answer, button) {

            const correctAnswer = quiz[currentQuestion].correct;

            if (answer === correctAnswer) {

                button.style.backgroundColor = "lightgreen";

                document.getElementById("feedback").innerText =
                    "Correct! 잘했어! 🎉";

                score++;

                setTimeout(function() {

                    currentQuestion++;

                    if (currentQuestion < quiz.length) {

                        showQuestion();

                    } else {

                        showResult();

                    }

                }, 1000);

            }

            else {

                button.style.backgroundColor = "lightcoral";

                document.getElementById("feedback").innerText =
                    "Incorrect! 틀렸어. 다시 골라봐!";

            }

        }


        function showResult() {

            document.getElementById("question").innerText =
                "Quiz Finished!";

            document.getElementById("answers").innerHTML = "";

            document.getElementById("feedback").innerText =
                "Your final score is " + score + " / 5 🎉";

            document.getElementById("score").innerText = "";

        }


        showQuestion();

    </script>

</body>

</html>
